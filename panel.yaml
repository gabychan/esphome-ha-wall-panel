    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_setpoint
          text: !lambda |-
            if (isnan(x)) return std::string("--°");
            char b[16]; snprintf(b, sizeof(b), "%.1f°", x);
            return std::string(b);

