interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - lvgl.label.update:
                id: lbl_clock
                text: !lambda |-
                  auto t = id(sntp_time).now();
                  char b[8]; snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
                  return std::string(b);
            - lvgl.label.update:
                id: lbl_date
                text: !lambda |-
                  static const char* dies[] = {"Dg","Dl","Dt","Dc","Dj","Dv","Ds"};
                  static const char* mesos[] = {"gen","feb","mar","abr","mai","jun","jul","ago","set","oct","nov","des"};
                  auto t = id(sntp_time).now();
                  char b[24];
                  snprintf(b, sizeof(b), "%s %d %s %d", dies[t.day_of_week-1], t.day_of_month, mesos[t.month-1], t.year);
                  return std::string(b);

binary_sensor:
  - platform: homeassistant
    id: presencia_salon
    entity_id: "${presence_entity}"
    filters:
      - delayed_off: 180s
    on_press:
      - lvgl.page.show: page_clock
      - lambda: 'id(g_black) = false;'
    on_release:
      - lvgl.page.show: page_black
      - lambda: 'id(g_black) = true;'

  # --- Estat de la llum del menjador (lamp_entity) ---
  - platform: homeassistant
    id: llum_comedor_estat
    entity_id: "${lamp_entity}"
    on_state:
      - script.execute: sync_llum

sensor:
  - platform: sht3xd
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Temperatura Salón"
      id: temp_salon
      filters:
        - offset: ${temp_offset}
      on_value:
        - lvgl.label.update:
            id: lbl_temp_now
            text: !lambda |-
              char b[16]; snprintf(b, sizeof(b), "%.1f°", x);
              return std::string(b);
    humidity:
      name: "Humedad Salón"
      id: hum_salon

