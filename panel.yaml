      - lvgl.image.update:
          id: img_agulla
          angle: !lambda 'return isnan(x) ? 0 : (int)(x * 10);'
      - lvgl.label.update:
          id: lbl_vent_dir
          text: !lambda |-
            static const char* v[] = {"Tramuntana","Gregal","Llevant","Xaloc","Migjorn","Garbí","Ponent","Mestral"};
