  # Positiu = comprant de la xarxa, negatiu = venent
  - platform: homeassistant
    id: ha_xarxa
    entity_id: "${grid_power_entity}"
    on_value:
      - lvgl.label.update:
          id: lbl_xarxa
          text: !lambda |-
            if (isnan(x)) return std::string("--");
            char b[16]; snprintf(b, sizeof(b), "%.0f W", fabsf(x));
            return std::string(b);
      - lvgl.label.update:
          id: lbl_xarxa_dir
          text: !lambda |-
            if (isnan(x)) return std::string("");
            if (x > 20)  return std::string("comprant");
            if (x < -20) return std::string("venent");
            return std::string("en equilibri");

