    - id: page_setmana
      bg_color: 0x0E1524
      bg_opa: COVER
      widgets:
        - label:
            align: TOP_MID
            y: 20
            text: "PREVISIÓ 7 DIES"
            text_font: font_med
            text_color: 0x56C7DE
        - obj:
            id: bar_0
            align: TOP_MID
            x: -324
