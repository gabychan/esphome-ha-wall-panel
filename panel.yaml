# =============================================================================
# ESPHome + LVGL wall panel for Home Assistant (800x480 RGB, CH422G, GT911)
#
# Pages (swipe left/right): clock, thermostat, weather, today's sun and rain,
# wind and rain compass, 7-day forecast, energy, awning, blinds, light.
#
# Everything that is specific to your house lives in the `substitutions` block
# below. UI labels are in Catalan; edit the strings in this file to translate.
# See README.md for what each page needs and how to remove pages you do not use.
# =============================================================================

substitutions:
  device_name: living-room-panel
  device_friendly_name: Living Room Panel
  timezone: Europe/Madrid
  town_name: "YOUR TOWN"
  # SHT3x sits next to the display and reads high. Calibrate it against a
  # reference thermometer placed 30 cm away (the author needed -6.12).
  temp_offset: "0.0"

  # --- Thermostat page -------------------------------------------------------
  thermostat_entity: climate.living_room_thermostat
  boiler_state_entity: sensor.boiler_statenumber   # Statenumber of the boiler (S.xx code)

  # --- Presence, light, awning, blinds ---------------------------------------
  presence_entity: binary_sensor.living_room_presence
  lamp_entity: switch.living_room_lamp
  awning_entity: cover.awning
  blind_right_entity: cover.blind_right
  blind_left_entity: cover.blind_left

  # --- Weather pages (Meteocat integration; station id as in its entity names)
  meteocat_station: your_station
  today_max_entity: sensor.today_max_temperature
  today_min_entity: sensor.today_min_temperature
  rain_probability_entity: sensor.rain_probability
  week_forecast_entity: sensor.week_forecast   # attributes `maxs` and `mins`: comma-separated integers
  sunrise_entity: sensor.sunrise_time          # text "HH:MM"
  sunset_entity: sensor.sunset_time            # text "HH:MM"

  # --- Energy page -----------------------------------------------------------
  solar_power_entity: sensor.solar_power       # W
  house_power_entity: sensor.house_power       # W
  grid_power_entity: sensor.grid_power         # W, positive = buying, negative = selling
  appliance_signal_entity: sensor.appliance_traffic_light   # text: verd / ambre / vermell / nit

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}

globals:
  - id: g_touching
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_start_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_last_x
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_black
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_swiped
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: sel_persiana
    type: int
    restore_value: no
    initial_value: '0'   # 0 = dreta, 1 = esquerra
  - id: wk_max
    type: int[7]
    restore_value: no
    initial_value: '{0,0,0,0,0,0,0}'
  - id: wk_min
    type: int[7]
    restore_value: no
    initial_value: '{0,0,0,0,0,0,0}'

i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true

ch422g:
  - id: ch422g_hub

output:
  - platform: gpio
    id: backlight_out
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true

light:
  - platform: binary
    name: "Backlight"
    id: backlight_light
    output: backlight_out
    restore_mode: ALWAYS_ON

display:
  - platform: rpi_dpi_rgb
    id: main_display
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 800
      height: 480
    color_order: RGB
    pclk_frequency: 16MHz
    pclk_inverted: true
    de_pin: 5
    hsync_pin: 46
    vsync_pin: 3
    pclk_pin: 7
    hsync_pulse_width: 4
    hsync_back_porch: 8
    hsync_front_porch: 8
    vsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    data_pins:
      red:   [1, 2, 42, 41, 40]
      green: [39, 0, 45, 48, 47, 21]
      blue:  [14, 38, 18, 17, 10]

touchscreen:
  - platform: gt911
    id: main_touch
    display: main_display
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: ch422g_hub
      number: 1
    on_touch:
      - if:
          condition:
            lambda: 'return id(g_black);'
          then:
            - lvgl.page.show: page_clock
            - lambda: 'id(g_black) = false;'
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            if (!id(g_touching)) {
              id(g_touching) = true;
              id(g_start_x) = touches[0].x;
              id(g_swiped) = false;
            }
            id(g_last_x) = touches[0].x;
            int dx = id(g_last_x) - id(g_start_x);
            if (dx > 40 || dx < -40) id(g_swiped) = true;
          }
    on_release:
      - lambda: 'id(g_touching) = false;'
      - if:
          condition:
            lambda: 'return (id(g_last_x) - id(g_start_x)) < -60;'
          then:
            - lvgl.page.next:
                animation: OUT_LEFT
                time: 250ms
      - if:
          condition:
            lambda: 'return (id(g_last_x) - id(g_start_x)) > 60;'
          then:
            - lvgl.page.previous:
                animation: OUT_RIGHT
                time: 250ms

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 26
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@500"
    id: font_med
    size: 38
    glyphsets: [GF_Latin_Core]
  # ENERGIA: afegida la "W" per als valors en watts
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 62
    glyphs: "0123456789.:+-° /W"
  - file: "gfonts://Roboto@700"
    id: font_huge
    size: 112
    glyphs: "0123456789.:+-° /"
  - file: "gfonts://Roboto@900"
    id: font_clock
    size: 150
    glyphs: "0123456789:-"
  - file: "gfonts://Roboto@700"
    id: font_w_temp
    size: 170
    glyphs: "0123456789.:+-° /"
  - file: "gfonts://Roboto@500"
    id: font_w_cond
    size: 52
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto"
    id: font_w_minmax
    size: 26
    glyphs: "0123456789 Mínàx°-/"
  - file: "gfonts://Roboto@500"
    id: font_week
    size: 28
    glyphs: ["°"]
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@500"
    id: font_vent
    size: 38
    glyphsets: [GF_Latin_Core]
    glyphs: ["°"]

image:
  - file: images/compass_dial.png
    id: img_dial
    resize: 300x300
    type: RGB565
    transparency: alpha_channel
  - file: images/compass_needle.png
    id: img_needle
    resize: 300x300
    type: RGB565
    transparency: alpha_channel

script:
  - id: update_alertes
    then:
      - lambda: |-
          std::string t;
          auto add = [&](text_sensor::TextSensor *s, const char *n) {
            if (s->state == "opened") {
              if (!t.empty()) t += ", ";
              t += n;
            }
          };
          add(id(al_vent), "Vent");
          add(id(al_pluja_int), "Pluja intensa");
          add(id(al_pluja_30), "Pluja intensa 30 min");
          add(id(al_pluja_3h), "Pluja intensa 3 h");
          add(id(al_pluja), "Pluja");
          add(id(al_mar), "Mar");
          add(id(al_fred), "Fred");
          add(id(al_calor), "Calor");
          add(id(al_calor_nit), "Calor nocturna");
          add(id(al_neu), "Neu");
          if (t.empty()) {
            lv_obj_add_flag(id(box_alerta), LV_OBJ_FLAG_HIDDEN);
          } else {
            std::string m = "Alerta: " + t;
            lv_label_set_text(id(lbl_alerta), m.c_str());
            lv_obj_clear_flag(id(box_alerta), LV_OBJ_FLAG_HIDDEN);
          }
  - id: sync_llum
    then:
      - if:
          condition:
            lambda: 'return id(llum_comedor_estat).state;'
          then:
            - lvgl.widget.update: { id: btn_llum_comedor, bg_color: 0xF5A623 }
            - lvgl.label.update:  { id: lbl_llum_comedor, text: "ENCESA", text_color: 0x1B2233 }
          else:
            - lvgl.widget.update: { id: btn_llum_comedor, bg_color: 0x25314C }
            - lvgl.label.update:  { id: lbl_llum_comedor, text: "APAGADA", text_color: 0x7C8BA5 }
  - id: update_ext
    then:
      - lvgl.label.update:
          id: lbl_ext
          text: !lambda |-
            float t = id(ha_ext_temp).state;
            float r = id(ha_pluja_ara).state;
            if (isnan(t)) return std::string("");
            char b[40];
            if (!isnan(r) && r > 0.0f)
              snprintf(b, sizeof(b), "Fora %.1f° - Plou", t);
            else
              snprintf(b, sizeof(b), "Fora %.1f°", t);
            return std::string(b);
  # Estat de la caldera a la pàgina del termòstat (codis S.xx del manual Vaillant)
  - id: update_caldera
    then:
      - lambda: |-
          float s = id(ha_caldera_state).state;
          const char *txt = "";
          uint32_t col = 0xF5A623;
          static char b[32];
          if (isnan(s)) {
            txt = "Caldera: sense dades";
            col = 0x7C8BA5;
          } else {
            int n = (int) s;
            if (n == 4) {
              txt = "Caldera: escalfant";
              col = 0xFF7043;
            } else if (n >= 0 && n <= 3) {
              txt = "Caldera: arrencant";
            } else if (n >= 5 && n <= 7) {
              txt = "Caldera: aturant";
            } else if (n == 8) {
              txt = "Caldera: en espera";
              col = 0x7C8BA5;
            } else if (n >= 10 && n <= 17) {
              txt = "Caldera: aigua calenta";
              col = 0x56C7DE;
            } else if (n >= 20 && n <= 28) {
              txt = "Caldera: arrencada en calent";
              col = 0x56C7DE;
            } else if (n == 30) {
              txt = "Caldera: sense demanda";
            } else if (n == 31) {
              txt = "Caldera: en repòs";
            } else if (n == 53 || n == 54) {
              txt = "Caldera: espera (S.54)";
              col = 0xB23A48;
            } else {
              snprintf(b, sizeof(b), "Caldera: S.%d", n);
              txt = b;
            }
          }
          lv_label_set_text(id(lbl_boiler), txt);
          lv_obj_set_style_text_color(id(lbl_boiler), lv_color_hex(col), 0);
  - id: redraw_week
    then:
      - lambda: |-
          auto parse = [](const std::string &str, int *out) -> int {
            int idx = 0; size_t start = 0;
            while (idx < 7) {
              size_t c = str.find(',', start);
              std::string tok = (c == std::string::npos) ? str.substr(start) : str.substr(start, c - start);
              if (tok.empty()) break;
              out[idx++] = atoi(tok.c_str());
              if (c == std::string::npos) break;
              start = c + 1;
            }
            return idx;
          };
          int nmax = parse(id(ha_week_max).state, id(wk_max));
          int nmin = parse(id(ha_week_min).state, id(wk_min));
          int n = (nmax < nmin) ? nmax : nmin;
          if (n <= 0) return;
          float amax = -1000, amin = 1000;
          for (int i = 0; i < n; i++) {
            if (id(wk_max)[i] > amax) amax = id(wk_max)[i];
            if (id(wk_min)[i] < amin) amin = id(wk_min)[i];
          }
          amax += 1; amin -= 1;
          if (amax <= amin) amax = amin + 1;
          const int Y_TOP = 100, Y_BOT = 360;
          const float H = Y_BOT - Y_TOP;
          static const char* dies[] = {"Dg","Dl","Dt","Dc","Dj","Dv","Ds"};
          auto t = id(sntp_time).now();
          int dow0 = t.is_valid() ? (t.day_of_week - 1) : 0;
          lv_obj_t* bars[7] = { id(bar_0),id(bar_1),id(bar_2),id(bar_3),id(bar_4),id(bar_5),id(bar_6) };
          lv_obj_t* lmx[7]  = { id(lmax_0),id(lmax_1),id(lmax_2),id(lmax_3),id(lmax_4),id(lmax_5),id(lmax_6) };
          lv_obj_t* lmn[7]  = { id(lmin_0),id(lmin_1),id(lmin_2),id(lmin_3),id(lmin_4),id(lmin_5),id(lmin_6) };
          lv_obj_t* ldy[7]  = { id(ldia_0),id(ldia_1),id(ldia_2),id(ldia_3),id(ldia_4),id(ldia_5),id(ldia_6) };
          char buf[8];
          for (int i = 0; i < 7; i++) {
            if (i >= n) {
              lv_obj_add_flag(bars[i], LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(lmx[i], "");
              lv_label_set_text(lmn[i], "");
              lv_label_set_text(ldy[i], "");
              continue;
            }
            lv_obj_clear_flag(bars[i], LV_OBJ_FLAG_HIDDEN);
            int ytop = Y_BOT - (int)((id(wk_max)[i] - amin) / (amax - amin) * H);
            int ybot = Y_BOT - (int)((id(wk_min)[i] - amin) / (amax - amin) * H);
            int h = ybot - ytop; if (h < 4) h = 4;
            lv_obj_set_y(bars[i], ytop);
            lv_obj_set_height(bars[i], h);
            snprintf(buf, sizeof(buf), "%d\xC2\xB0", id(wk_max)[i]); lv_label_set_text(lmx[i], buf);
            snprintf(buf, sizeof(buf), "%d\xC2\xB0", id(wk_min)[i]); lv_label_set_text(lmn[i], buf);
            lv_label_set_text(ldy[i], dies[(dow0 + i) % 7]);
          }

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  disp_bg_color: 0x0E1524
  text_font: font_med
  text_color: 0xF2F5FA
  on_idle:
    timeout: 60s
    then:
      - if:
          condition:
            lambda: 'return !id(g_black);'
          then:
            - lvgl.page.show: page_clock
  pages:

    - id: page_clock
      bg_color: 0x0E1524
      bg_opa: COVER
      widgets:
        - label:
            id: lbl_clock
            align: CENTER
            y: -20
            text_font: font_clock
            text_color: 0x56C7DE
            text: "--:--"
        - label:
            id: lbl_date
            align: CENTER
            y: 95
            text_font: font_med
            text_color: 0x7C8BA5
            text: "-- --- ----"
        - label:
            id: lbl_ext
            align: CENTER
            y: 150
            text_font: font_vent
            text_color: 0x7FD8EA
            text: ""
        - obj:
            id: box_alerta
            align: TOP_MID
            y: 20
            width: 740
            height: 56
            radius: 12
            bg_color: 0xB23A48
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            hidden: true
            widgets:
              - label:
                  id: lbl_alerta
                  align: CENTER
                  width: 700
                  long_mode: DOT
                  text_align: CENTER
                  text: ""
                  text_font: font_small
                  text_color: 0xFFFFFF

    - id: page_thermo
      bg_color: 0x0E1524
      bg_opa: COVER
      widgets:
        - label:
            align: TOP_MID
            y: 55
            text: "TEMPERATURA"
            text_font: font_small
            text_color: 0x7C8BA5
        - label:
            id: lbl_temp_now
            align: TOP_MID
            y: 83
            text_font: font_huge
            text_color: 0x7FD8EA
            text: "21.3°"
        - label:
            id: lbl_boiler
            align: TOP_MID
            y: 210
            text: "Caldera: en repòs"
            text_font: font_small
            text_color: 0xF5A623
        - label:
            align: TOP_MID
            y: 262
            text: "CONSIGNA"
            text_font: font_small
            text_color: 0x7C8BA5
        - button:
            align: TOP_MID
            x: -175
            y: 290
            width: 92
            height: 92
            bg_color: 0x25314C
            widgets:
              - label:
                  align: CENTER
                  text: "-"
                  text_font: font_big
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(g_swiped);'
                  then:
                    - homeassistant.action:
                        action: climate.set_temperature
                        data_template:
                          entity_id: "${thermostat_entity}"
                          temperature: "{{ t }}"
                        variables:
                          t: |-
                            float s = id(ha_setpoint).state;
                            if (isnan(s)) s = id(temp_salon).state;
                            return s - 0.5;
        - label:
            id: lbl_setpoint
            align: TOP_MID
            y: 305
            text: "--°"
            text_font: font_big
            text_color: 0x4ADE80
        - button:
            align: TOP_MID
            x: 175
            y: 290
            width: 92
            height: 92
            bg_color: 0x25314C
            widgets:
              - label:
                  align: CENTER
                  text: "+"
                  text_font: font_big
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(g_swiped);'
                  then:
                    - homeassistant.action:
                        action: climate.set_temperature
                        data_template:
                          entity_id: "${thermostat_entity}"
                          temperature: "{{ t }}"
                        variables:
                          t: |-
                            float s = id(ha_setpoint).state;
                            if (isnan(s)) s = id(temp_salon).state;
                            return s + 0.5;

    - id: page_weather
      bg_color: 0x0E1524
      bg_opa: COVER
      widgets:
        - label:
            align: CENTER
            y: -165
            text: "${town_name}"
            text_font: font_med
            text_color: 0x7C8BA5
        - label:
            id: lbl_w_temp
            align: CENTER
            y: -25
            text: "--°"
            text_font: font_w_temp
            text_color: 0xFFB454
        - label:
            id: lbl_w_cond
            align: CENTER
            y: 125
            text: "..."
            text_font: font_w_cond
            text_color: 0xFFB454
        - label:
            id: lbl_w_minmax
