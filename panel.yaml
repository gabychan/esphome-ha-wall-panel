            return std::string(b);

  - platform: homeassistant
    id: ha_vent_vel
    entity_id: "sensor.meteocat_up_${meteocat_station}_viento_velocidad"
    on_value:
      - lvgl.label.update:
          id: lbl_vent_vel
          text: !lambda |-
            if (isnan(x)) return std::string("--");
            char b[16]; snprintf(b, sizeof(b), "%.0f km/h", x);
            return std::string(b);

  - platform: homeassistant
    id: ha_vent_racha
    entity_id: "sensor.meteocat_up_${meteocat_station}_viento_racha"
    on_value:
      - lvgl.label.update:
          id: lbl_vent_racha
          text: !lambda |-
            if (isnan(x)) return std::string("--");
            char b[16]; snprintf(b, sizeof(b), "%.0f km/h", x);
            return std::string(b);

  - platform: homeassistant
    id: ha_ext_temp
    entity_id: "sensor.meteocat_up_${meteocat_station}_temperatura"
    on_value:
      - script.execute: update_ext

  - platform: homeassistant
    id: ha_pluja_ara
    entity_id: "sensor.meteocat_up_${meteocat_station}_precipitacion"
    on_value:
      - script.execute: update_ext
      - lvgl.label.update:
          id: lbl_pluja
          text: !lambda |-
            char b[40];
            snprintf(b, sizeof(b), "%.1f / %.1f mm", id(ha_pluja_ara).state, id(ha_pluja_dia).state);
            return std::string(b);

  - platform: homeassistant
    id: ha_pluja_dia
    entity_id: "sensor.meteocat_up_${meteocat_station}_precipitacion_acumulada"
    on_value:
      - lvgl.label.update:
          id: lbl_pluja
          text: !lambda |-
            char b[40];
            snprintf(b, sizeof(b), "%.1f / %.1f mm", id(ha_pluja_ara).state, id(ha_pluja_dia).state);
            return std::string(b);

text_sensor:
  - platform: homeassistant
    id: ha_w_cond
    entity_id: "weather.meteocat_up_weather_${meteocat_station}"
    on_value:
      - lvgl.label.update:
          id: lbl_w_cond
          text: !lambda |-
            if (x == "sunny")         return std::string("Assolellat");
            if (x == "clear-night")   return std::string("Nit clara");
            if (x == "partlycloudy")  return std::string("Mig ennuvolat");
            if (x == "cloudy")        return std::string("Ennuvolat");
            if (x == "rainy")         return std::string("Pluja");
            if (x == "pouring")       return std::string("Pluja forta");
            if (x == "lightning" || x == "lightning-rainy") return std::string("Tempesta");
            if (x == "snowy")         return std::string("Neu");
            if (x == "snowy-rainy")   return std::string("Aiguaneu");
            if (x == "fog")           return std::string("Boira");
            if (x == "hail")          return std::string("Calamarsa");
            if (x == "windy" || x == "windy-variant") return std::string("Vent");
            return std::string(x.c_str());

  - platform: homeassistant
    id: ha_sol_sortida
    entity_id: "${sunrise_entity}"
    on_value:
      - lvgl.label.update:
          id: lbl_sol_sortida
          text: !lambda 'return x;'
  - platform: homeassistant
    id: ha_sol_posta
    entity_id: "${sunset_entity}"
    on_value:
      - lvgl.label.update:
          id: lbl_sol_posta
          text: !lambda 'return x;'

  - platform: homeassistant
    id: ha_week_max
    entity_id: "${week_forecast_entity}"
    attribute: maxs
    on_value:
      - script.execute: redraw_week
  - platform: homeassistant
    id: ha_week_min
    entity_id: "${week_forecast_entity}"
    attribute: mins
    on_value:
      - script.execute: redraw_week

  # ===================== ENERGIA: semàfor =====================
  - platform: homeassistant
    id: ha_semafor
    entity_id: "${appliance_signal_entity}"
    on_value:
      - if:
          condition:
            lambda: 'return x == "verd";'
          then:
            - lvgl.widget.update: { id: box_semafor, bg_color: 0x2E7D5B }
            - lvgl.label.update:  { id: lbl_semafor, text: "Bon moment per posar rentadora o rentaplats" }
      - if:
          condition:
            lambda: 'return x == "ambre";'
          then:
            - lvgl.widget.update: { id: box_semafor, bg_color: 0xB7791F }
            - lvgl.label.update:  { id: lbl_semafor, text: "Justet: millor esperar una mica" }
      - if:
          condition:
            lambda: 'return x == "vermell";'
          then:
            - lvgl.widget.update: { id: box_semafor, bg_color: 0xB23A48 }
            - lvgl.label.update:  { id: lbl_semafor, text: "Ara no: estaríem comprant llum" }
      - if:
          condition:
            lambda: 'return x == "nit";'
          then:
            - lvgl.widget.update: { id: box_semafor, bg_color: 0x25314C }
            - lvgl.label.update:  { id: lbl_semafor, text: "Sense sol: millor demà al matí" }

